<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b2a3f">
  <title>Aquarium (prototype)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f5c542"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c9961a" stroke-width="2"/><path d="M9 8.5h4.5a2 2 0 0 1 0 4H10.5a2 2 0 0 0 0 4H15" fill="none" stroke="#a87808" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-food" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="15" rx="3" fill="#ff8a3d"/><rect x="7" y="3" width="10" height="4" rx="1.5" fill="#d9d9d9"/><circle cx="10" cy="12" r="1.3" fill="#fff4"/><circle cx="14" cy="15" r="1.3" fill="#fff4"/><circle cx="11" cy="17.5" r="1.1" fill="#fff4"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11V4a1.5 1.5 0 0 1 3 0v7V5.5a1.5 1.5 0 0 1 3 0V13v-3a1.5 1.5 0 0 1 3 0v4.5c0 4-3 7.5-7 7.5h-1c-2.5 0-4-1.2-5.2-3L4.5 14a1.6 1.6 0 0 1 2.6-1.8z" fill="#ffe0bf" stroke="#8a5a3a" stroke-width="1.2" stroke-linejoin="round"/></symbol>
      <symbol id="i-sponge" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="3" fill="#ffd84a" stroke="#c8a21a" stroke-width="1.2"/><rect x="3" y="14" width="18" height="4" rx="1.5" fill="#3aa35a"/><circle cx="8" cy="10.5" r="1.1" fill="#c8a21a"/><circle cx="13" cy="11.5" r="1.3" fill="#c8a21a"/><circle cx="17" cy="10" r="0.9" fill="#c8a21a"/></symbol>
      <symbol id="i-shop" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 12H6.2z" fill="#6fd3ff" stroke="#1f7fb0" stroke-width="1.2" stroke-linejoin="round"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9" fill="none" stroke="#1f7fb0" stroke-width="1.6" stroke-linecap="round"/><path d="M8.5 15c1.2-1.4 3.5-1.6 5 0l1.5-1v2l-1.5-1c-1.5 1.6-3.8 1.4-5 0z" fill="#ff7a3d"/></symbol>
      <symbol id="i-buyfood" viewBox="0 0 24 24"><rect x="4" y="7" width="11" height="14" rx="3" fill="#ff8a3d"/><rect x="5" y="4" width="9" height="4" rx="1.5" fill="#d9d9d9"/><circle cx="18" cy="8" r="5" fill="#2ecc71"/><path d="M18 5.5v5M15.5 8h5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <div id="app">
    <header id="hud">
      <div class="res" id="res-gold" title="Gold"><svg><use href="#i-coin"/></svg><span id="gold">0</span></div>
      <div class="res" id="res-food" title="Food"><svg><use href="#i-food"/></svg><span id="food">0</span></div>
      <div id="dirt-wrap" title="Dirt">
        <div id="dirt-label">Clean</div>
        <div id="dirt-bar" aria-label="Dirt stage">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <div id="dirt-callout" hidden>Clean the tank first</div>
      </div>
    </header>
    <div id="tankbar" title="Tank level: level-ups and cleans earn XP; tank levels unlock species">
      <span id="tank-label">Tank Lv 1</span>
      <div class="bar"><div id="tank-xpbar"></div></div>
    </div>

    <main id="tank-wrap">
      <canvas id="tank" aria-label="Aquarium tank"></canvas>
      <div id="toasts"></div>
      <div id="hint"></div>

      <section id="panel" class="sheet" hidden>
        <button class="close" data-close="panel" aria-label="Close">&times;</button>
        <div class="panel-head">
          <canvas id="panel-portrait" width="160" height="96"></canvas>
          <div>
            <div class="p-name" id="p-name"></div>
            <div class="p-latin" id="p-latin"></div>
            <div class="p-chips"><span class="chip" id="p-rarity"></span><span class="chip" id="p-level"></span></div>
          </div>
        </div>
        <div class="p-row alive"><span class="k">Growth</span><span class="v" id="p-growth"></span></div>
        <div class="bar alive"><div id="p-growbar"></div></div>
        <div class="p-row alive"><span class="k">Hunger</span><span class="v" id="p-hunger"></span></div>
        <div class="p-row small alive"><span class="k">Food per feed</span><span class="v" id="p-portion"></span></div>
        <div class="p-row deadonly"><span class="k">Status</span><span class="v danger" id="p-dead">Dead</span></div>
        <button id="p-sell" class="btn wide"></button>
      </section>

      <section id="shop" class="sheet" hidden>
        <button class="close" data-close="shop" aria-label="Close">&times;</button>
        <h2>Fish shop <small>babies only</small></h2>
        <div id="shop-tankrow"><span id="shop-tank"></span><div class="bar"><div id="shop-tankbar"></div></div></div>
        <div id="shop-list"></div>
        <button class="btn wide diamond" disabled title="Diamonds are not available in this prototype">&#9670; Diamonds: coming later</button>
        <p class="note" id="shop-note"></p>
      </section>

      <div id="tankover" class="modal" hidden>
        <div class="modal-box">
          <p><strong>Your tank is empty</strong></p>
          <p>No fish left and not enough gold for a baby. Start a fresh tank with 20 gold and 10 food.</p>
          <div class="modal-actions">
            <button class="btn primary" id="btn-newtank">Start new tank</button>
          </div>
        </div>
      </div>
      <div id="away" class="modal" hidden>
        <div class="modal-box">
          <p><strong>While you were away</strong> <span id="away-time"></span></p>
          <ul id="away-list"></ul>
          <div class="modal-actions"><button class="btn primary" id="away-ok">OK</button></div>
        </div>
      </div>
      <div id="confirm" class="modal" hidden>
        <div class="modal-box">
          <p id="confirm-text"></p>
          <div class="modal-actions">
            <button class="btn" id="confirm-no">Cancel</button>
            <button class="btn danger" id="confirm-yes">Release</button>
          </div>
        </div>
      </div>
    </main>

    <nav id="tools">
      <button class="tool" data-tool="hand" aria-pressed="true"><svg><use href="#i-hand"/></svg><span>Look</span></button>
      <button class="tool" data-tool="food"><svg><use href="#i-food"/></svg><span>Food</span></button>
      <button class="tool" data-tool="sponge"><svg><use href="#i-sponge"/></svg><span>Sponge</span></button>
      <button class="tool action" id="btn-shop"><svg><use href="#i-shop"/></svg><span>Shop</span></button>
      <button class="tool action" id="btn-buyfood"><svg><use href="#i-buyfood"/></svg><span id="buyfood-label">Buy food</span></button>
    </nav>

    <footer id="debug">
      <span class="dbg-title">DEBUG</span>
      <span id="speed-btns"></span>
      <button id="dbg-gold" class="dbg">+100g</button>
      <button id="dbg-reset" class="dbg warn">Reset save</button>
      <span id="dbg-clock"></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="js/fishart.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
